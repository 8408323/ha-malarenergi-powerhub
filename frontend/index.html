<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PowerHub panel preview</title>
<style>body{margin:0;background:#111;--primary-background-color:#111;--card-background-color:#1c1c1c;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--primary-color:#03a9f4;color-scheme:dark}</style>
</head><body><malarenergi-powerhub-panel id="p"></malarenergi-powerhub-panel>
<script type="module">
// Synthetic data. Flags: ?lang=en&narrow=1&sources=solar,battery,wind,generator,v2g,other&ev=1&sensors=1&bitvis=0&export=1
import "/src/main.tsx";
import mock from "/dev/mock.json";
const q = new URLSearchParams(location.search), on = (k, d = "0") => (q.get(k) ?? d) === "1";
const { entities, states } = structuredClone(mock);
if (!on("bitvis", "1")) for (const k in entities) if (entities[k].platform === "bitvis") delete entities[k];
if (on("export")) for (const id of ["sensor.powerhub_power_import", "sensor.bitvis_power_import"]) states[id].state = "0";
if (on("export")) for (const id of ["sensor.powerhub_power_export", "sensor.bitvis_power_export"]) states[id].state = "1.84";
const s = on("sensors");
if ((q.get("sources") ?? "").includes("v2g")) states["sensor.wallbox_power"].state = "-1200";
let options = { show_panel: true, sources: (q.get("sources") ?? "solar").split(",").filter(Boolean), has_ev: on("ev"),
  production_power: s ? "sensor.inverter_pv_power" : "", battery_power: s ? "sensor.inverter_battery_power" : "",
  battery_soc: s ? "sensor.battery_soc" : "", battery_invert: false, ev_power: s ? "sensor.wallbox_power" : "" };
const p = document.getElementById("p");
p.narrow = innerWidth < 600 || on("narrow");
if (on("narrow")) document.body.style.width = "390px";
p.hass = { language: q.get("lang") || "sv", user: { is_admin: true }, entities, states,
  connection: { sendMessagePromise: async (m) => {
    if (m.type.endsWith("/set")) options = { ...options, ...m.options };
    return { options };
  } } };
</script></body></html>
